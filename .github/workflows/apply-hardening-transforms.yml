name: Apply hardening transforms

on:
  push:
    branches:
      - improve/assessment-reliability-hardening
    paths:
      - .github/workflows/apply-hardening-transforms.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/assessment-reliability-hardening
      - name: Apply asserted source transforms
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "apps/api/odysseus_api/models.py",
              "    command: Mapped[str] = mapped_column(Text)\n    status: Mapped[str] = mapped_column(String(20), default=\"queued\")",
              "    command: Mapped[str] = mapped_column(Text)\n    # 실행 요청 당시 workspace payload. Redis 전달 장애/재시작에도 정확히 같은 입력을 재생한다.\n    input_files: Mapped[list | None] = mapped_column(JSONB, nullable=True)\n    status: Mapped[str] = mapped_column(String(20), default=\"queued\")",
          )

          replace(
              "apps/api/odysseus_api/ai/agent.py",
              "            execution = Execution(\n                attempt_id=attempt_id,\n                scenario_id=scenario_id,\n                user_id=user_id,\n                source=\"agent\",\n                command=command,\n                callback_token=new_callback_token(),\n            )",
              "            rows = await ws.list_files(db, attempt_id, scenario_id)\n            input_files = ws.files_payload(rows)\n            execution = Execution(\n                attempt_id=attempt_id,\n                scenario_id=scenario_id,\n                user_id=user_id,\n                source=\"agent\",\n                command=command,\n                input_files=input_files,\n                callback_token=new_callback_token(),\n            )",
          )
          replace(
              "apps/api/odysseus_api/ai/agent.py",
              "            await db.commit()\n            rows = await ws.list_files(db, attempt_id, scenario_id)\n            await enqueue_run(\n                str(execution.id),\n                command,\n                ws.files_payload(rows),",
              "            await db.commit()\n            await enqueue_run(\n                str(execution.id),\n                command,\n                execution.input_files or [],",
          )

          replace(
              "apps/api/odysseus_api/ai/autoeval.py",
              "                    source=\"check\",\n                    command=command,\n                    callback_token=new_callback_token(),",
              "                    source=\"check\",\n                    command=command,\n                    input_files=ws.files_payload(files),\n                    callback_token=new_callback_token(),",
          )
          replace(
              "apps/api/odysseus_api/ai/autoeval.py",
              "                    command,\n                    ws.files_payload(files),\n                    settings.run_timeout_s,",
              "                    command,\n                    execution.input_files or [],\n                    settings.run_timeout_s,",
          )

          replace(
              "apps/api/odysseus_api/ai/scenario_author.py",
              "   `objectives_md` too, so graders can see them.\n6. **`objectives_md` is the hidden truth.** State the real requirements, the\n   trap, and the exact expected results. It is shown only to NPCs and graders,\n   never to the candidate.",
              "   `objectives_md` too, so graders can see them.\n6. **`objectives_md` is the hidden truth.** State the real requirements, the\n   trap, and the exact expected results. It is used only by server-side grading/\n   requirement derivation and is never shown to NPCs or candidates. Every fact\n   the candidate must discover must therefore also exist in a character's\n   `knowledge` or an initial file.",
          )

          replace(
              "apps/web/app/exam/[attemptId]/page.tsx",
              "      push(type, { chars: trimmed.length, text: trimmed.slice(0, 500) });",
              "      push(type, { chars: trimmed.length });",
          )
          PY
      - name: Compile transformed Python
        run: python -m compileall -q apps/api/odysseus_api apps/runner
      - name: Commit transforms
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/odysseus_api/models.py apps/api/odysseus_api/ai/agent.py apps/api/odysseus_api/ai/autoeval.py apps/api/odysseus_api/ai/scenario_author.py 'apps/web/app/exam/[attemptId]/page.tsx'
          git commit -m "feat(reliability): persist exact run inputs and minimize telemetry"
          git push origin HEAD:improve/assessment-reliability-hardening
