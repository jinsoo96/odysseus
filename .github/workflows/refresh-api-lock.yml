name: Refresh API lockfile

on:
  push:
    branches:
      - improve/assessment-reliability-hardening
    paths:
      - .github/workflows/refresh-api-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/assessment-reliability-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve declared runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r apps/api/requirements.txt
          python -m pip check
          python -m pip freeze > apps/api/requirements.lock
      - name: Audit resolved lockfile
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r apps/api/requirements.lock
      - name: Compile and run reliability tests against resolved environment
        env:
          PYTHONPATH: apps/api
          ODYSSEUS_ENV: development
          DATA_ENCRYPTION_KEY: ci-data-encryption-key-222222222222222222222222222222222222222222222222222222222222
        run: |
          python -m compileall -q apps/api/odysseus_api apps/runner tests
          python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- apps/api/requirements.lock; then
            echo "lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/requirements.lock
          git commit -m "fix(deps): refresh audited Python lockfile"
          git push origin HEAD:improve/assessment-reliability-hardening
