name: Refresh web lockfile

on:
  push:
    branches:
      - improve/assessment-reliability-hardening
    paths:
      - .github/workflows/refresh-web-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/assessment-reliability-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Regenerate lockfile from package manifest
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Verify no high/critical production advisory remains
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "fix(web): refresh lockfile for patched PostCSS"
          git push origin HEAD:improve/assessment-reliability-hardening
