name: odysseus

# 러너는 응시자 코드를 돌린다. 그래서 외부 인터넷도, 데이터베이스도 닿으면 안 된다.
#   backplane — 기본 망(외부 egress 가능). api 가 GitHub·검색을 대리 조회하는 통로.
#   sandbox   — internal: true. 게이트웨이가 없어 컨테이너가 밖으로 나갈 수 없다.
#               러너는 여기에만 붙으므로 redis(잡 큐)·api(콜백)까지만 닿는다.
networks:
  backplane:
    driver: bridge
  sandbox:
    driver: bridge
    internal: true

services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      POSTGRES_USER: odysseus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odysseus}
      POSTGRES_DB: odysseus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odysseus -d odysseus"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backplane

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    environment:
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?REDIS_API_PASSWORD 가 필요합니다 — .env 에 `openssl rand -hex 32` 값을 넣으세요}
      REDIS_RUNNER_PASSWORD: ${REDIS_RUNNER_PASSWORD:?REDIS_RUNNER_PASSWORD 가 필요합니다 — .env 에 `openssl rand -hex 32` 값을 넣으세요}
    command:
      - sh
      - -c
      - |
        set -eu
        printf 'user default off\n' > /tmp/users.acl
        printf 'user api on >%s ~* &* +@all\n' "$$REDIS_API_PASSWORD" >> /tmp/users.acl
        # runner는 pending/processing 큐와 자기 통계·취소 키만 사용한다. FLUSH/KEYS 같은 광역 명령은 없다.
        printf 'user runner on >%s ~odysseus:run:* ~odysseus:runner:* ~odysseus:attempt:* -@all +brpop +brpoplpush +rpoplpush +lrem +lpush +llen +set +hincrby +hincrbyfloat +expire +smembers +sismember +srem +ping +multi +exec +client|setinfo\n' "$$REDIS_RUNNER_PASSWORD" >> /tmp/users.acl
        chmod 600 /tmp/users.acl
        exec redis-server --aclfile /tmp/users.acl --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user api --pass \"$$REDIS_API_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backplane
      - sandbox

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://odysseus:${POSTGRES_PASSWORD:-odysseus}@postgres:5432/odysseus
      REDIS_URL: redis://api:${REDIS_API_PASSWORD:?}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 필요합니다 — .env 에 `openssl rand -hex 32` 값을 넣으세요}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN 이 필요합니다 — .env 에 `openssl rand -hex 32` 값을 넣으세요}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY 가 필요합니다 — DB 비밀값 암호화용으로 `openssl rand -hex 32` 값을 넣으세요}
      ODYSSEUS_ENV: ${ODYSSEUS_ENV:-production}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_EVAL_MODEL: ${AI_EVAL_MODEL:-gpt-4o-mini}
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backplane
      - sandbox

  runner:
    build: ./apps/runner
    restart: unless-stopped
    environment:
      REDIS_URL: redis://runner:${REDIS_RUNNER_PASSWORD:?}@redis:6379/0
      API_BASE_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN 이 필요합니다}
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-2}
      RUNNER_MEM_MB: ${RUNNER_MEM_MB:-4096}
      # replica를 여러 개 띄우면 반드시 각 replica에 고유하고 재시작 후에도 동일한 ID를 준다.
      RUNNER_ID: ${RUNNER_ID:-runner-main}
      # 실행 하나의 실제 descendant RSS 상한. 비우면 컨테이너 메모리의 80%/동시성으로 자동 계산.
      RUNNER_EXEC_MEM_MB: ${RUNNER_EXEC_MEM_MB:-}
      # 운영에서는 namespace isolation이 불가능한 호스트에서 fail-open하지 않는다.
      RUNNER_REQUIRE_ISOLATION: ${RUNNER_REQUIRE_ISOLATION:-true}
    mem_limit: ${RUNNER_MEM_MB:-4096}m
    pids_limit: 1024
    # gVisor(runsc)가 설치된 호스트에서는 RUNNER_RUNTIME=runsc 로 OCI 격리층을 한 겹 더 둘 수 있다.
    runtime: ${RUNNER_RUNTIME:-runc}
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SETUID
      - SETGID
      - KILL
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    networks:
      - sandbox
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    networks:
      - backplane
    depends_on:
      api:
        condition: service_started

  edge:
    environment:
      EDGE_HTTPS_ONLY: ${EDGE_HTTPS_ONLY:-off}
    build: ./apps/edge
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3100}:80"
    networks:
      - backplane
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started

volumes:
  pgdata:
